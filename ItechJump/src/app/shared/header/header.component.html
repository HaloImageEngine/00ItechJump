<header class="header">
  <div class="header-inner">
    <!-- Brand / Logo -->
    <a class="brand" routerLink="/">
      <app-brand-logo variant="wide" />
    </a>

    <!-- Device indicator beside the logo: phone on Mobile, house on Desktop -->
    @if (device.isMobile()) {
      <span class="device-badge device-badge--mobile" title="Mobile view" aria-label="Mobile view">
        <span class="material-icons" aria-hidden="true">smartphone</span>
      </span>
    } @else {
      <span class="device-badge device-badge--desktop" title="Desktop view" aria-label="Desktop view">
        <span class="material-icons" aria-hidden="true">home</span>
      </span>
    }

    <!-- Nav + user alias on the right -->
    <div class="header-right">
      <!-- Existing nav -->
      <app-nav></app-nav>

      <!-- Auth section -->
      <div class="auth-section">
        <!-- Show alias if we have one - bright acid green - hides on logoff -->
        <span
          class="user-alias"
          *ngIf="userAlias && isLoggedIn"
        >
          {{ userAlias }}
        </span>

        <!-- Single auth button; label & behavior come from TS -->
        <button
          type="button"
          class="auth-btn"
          (click)="onAuthClick()"
        >
          {{ authLabel }}
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Version popup -->
<div
  class="version-backdrop"
  *ngIf="showVersion()"
  (click)="closeVersion()"
>
  <div class="version-modal" (click)="$event.stopPropagation()">
    <div class="version-body">
      <p class="version-line">Version {{ versionId }} ({{ appVersion }})</p>
      <p class="version-line">Written by : WDBeaty</p>
    </div>
    <button
      type="button"
      class="version-close"
      (click)="closeVersion()"
    >
      Close
    </button>
  </div>
</div>
